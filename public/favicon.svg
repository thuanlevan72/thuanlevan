<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="tl-bg" x1="48" y1="32" x2="464" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05080F" />
      <stop offset="52%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#0F3057" />
    </linearGradient>
    <radialGradient id="tl-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(384 116) rotate(135) scale(290)">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.34" />
      <stop offset="55%" stop-color="#0284C7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0A192F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tl-border" x1="24" y1="24" x2="488" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#1D4ED8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="tl-accent" x1="280" y1="150" x2="404" y2="368" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Outer rounded squircle container -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#tl-bg)" />
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#tl-glow)" />
  <rect x="28" y="28" width="456" height="456" rx="108" stroke="url(#tl-border)" stroke-width="10" />

  <!-- Architectural monogram T -->
  <path
    d="M114 148H288V192H223V364H179V192H114V148Z"
    fill="#F8FAFC"
  />

  <!-- Architectural monogram L with ocean blue gradient -->
  <path
    d="M272 208H316V320H398V364H272V208Z"
